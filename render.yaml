# Render Blueprint — FREE instance only (~$0/mo).
# สร้าง Supabase Postgres แยก แล้วใส่ DATABASE_URL + secrets ใน Dashboard.
#
# ⚠️  อย่าเลือก Starter ตอนสร้างมือ — Starter = ~$7/mo ($0.0097/hr)
#     หลัง deploy ตรวจ Settings → Instance Type ต้องเป็น "Free"
#
# Fresh deploy: ลบ web service เก่า (Starter) ก่อน — ดู DEPLOY.md Phase 0

services:
  - type: web
    name: cleft-api
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    branch: main
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SAME_SITE
        value: none
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

      # Render injects PORT automatically — do not hardcode 4000

      # Set in Dashboard (never commit secrets):
      # - DATABASE_URL — Supabase connection URI (Singapore)
      # - FRONTEND_URL — e.g. https://your-app.vercel.app
      # - GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_CALLBACK_URL
      # - JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
